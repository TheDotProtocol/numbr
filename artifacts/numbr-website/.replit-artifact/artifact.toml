kind = "web"
previewPath = "/"
title = "Numbr — Global Communications Platform"
version = "1.0.0"
id = "artifacts/numbr-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24516

[services.development]
run = "pnpm --filter @workspace/numbr-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/numbr-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/numbr-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24516"
BASE_PATH = "/"
